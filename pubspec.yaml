name: cached_network_image
description: Flutter library to load and cache network images.
  Can also be used with placeholder and error widgets.
homepage: https://github.com/Baseflow/flutter_cached_network_image
topics:
  - cache
  - image
  - network-image
version: 3.5.0

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_cache_manager:
    git:
      url: https://github.com/Railway-Engineering-Solutions/flutter_cache_manager.git
      ref: feat/network-request-cancellation-2
      path: flutter_cache_manager
  octo_image: ^2.1.0

dev_dependencies:
  file: ">=7.0.0 <8.0.0"
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
